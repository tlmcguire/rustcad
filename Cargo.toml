[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"

# unsafe is forbidden everywhere by default.
# cad-kernel-occt will opt out explicitly when the FFI lands (ARCHITECTURE.md, rule 2).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
