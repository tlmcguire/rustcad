[package]
name = "cad-kernel-occt"
description = "OpenCascade backend for the Kernel trait. The only crate allowed to use unsafe."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
cad-kernel = { version = "0.0.0", path = "../cad-kernel" }
cad-math = { version = "0.0.0", path = "../cad-math" }

[build-dependencies]
cc = "1"

# The workspace lints, except that unsafe is denied rather than forbidden so the
# `ffi` module can allow it (ARCHITECTURE.md, rule 2). Keep in step with the root Cargo.toml.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
