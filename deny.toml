# License and advisory policy. Protected path: loop agents may not edit this file.
[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "MPL-2.0", "Unicode-3.0", "CC0-1.0",
]
confidence-threshold = 0.9

# The workspace's own crates are GPL-3.0-or-later (DECISIONS.md, D12) and are never published.
# They are exempt, so the allowlist above governs third-party dependencies only.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
